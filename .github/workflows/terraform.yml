name: Terraform Infrastructure Provisioning

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute (plan, apply, destroy)"
        required: true
        type: choice
        options:
          - apply
          - plan
          - destroy
        default: apply
      target:
        description: "Component to target"
        required: true
        type: choice
        options:
          - all
          - bootstrap
          - pilot
        default: all

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Execution
    runs-on: ubuntu-latest
    environment: pilot
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Verify AWS Identity
        id: aws-id
        run: |
          echo "Assumed AWS Caller Identity:"
          aws sts get-caller-identity
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      - name: Bootstrap State Bucket
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'bootstrap' || github.event.inputs.target == ''
        run: |
          echo "=== Provisioning Bootstrap State Bucket ==="
          cd infra/terraform/bootstrap
          terraform init
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then ACTION="apply"; fi
          if [ "$ACTION" = "plan" ]; then
            terraform plan
          else
            if aws s3api head-bucket --bucket "odoo-process-memory-tfstate-$ACCOUNT_ID" 2>/dev/null; then
              echo "State bucket odoo-process-memory-tfstate-$ACCOUNT_ID already exists."
            else
              terraform apply -auto-approve
            fi
          fi

      - name: Provision Pilot Infrastructure (VPC, EC2, ECR, Cognito)
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'pilot' || github.event.inputs.target == ''
        run: |
          echo "=== Initializing Pilot Terraform ==="
          cd infra/terraform/pilot
          terraform init -backend-config="bucket=odoo-process-memory-tfstate-$ACCOUNT_ID" -reconfigure
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then ACTION="apply"; fi
          
          if [ "$ACTION" = "plan" ]; then
            echo "=== Running Terraform Plan ==="
            terraform plan
          elif [ "$ACTION" = "apply" ]; then
            echo "=== Running Terraform Plan & Apply ==="
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan
            
            echo "=== Terraform Outputs ==="
            terraform output
            
            EC2_ID=$(terraform output -raw ec2_instance_id 2>/dev/null || true)
            VPC_IP=$(terraform output -raw elastic_ip 2>/dev/null || true)
            ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null || true)
            COGNITO_ID=$(terraform output -raw cognito_user_pool_id 2>/dev/null || true)
            
            echo "### Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **EC2 Instance ID:** \`$EC2_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Elastic IP (VPC):** \`$VPC_IP\`" >> $GITHUB_STEP_SUMMARY
            echo "- **ECR Repository URL:** \`$ECR_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Cognito User Pool ID:** \`$COGNITO_ID\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$ACTION" = "destroy" ]; then
            echo "=== WARNING: Destroying Pilot Resources ==="
            terraform destroy -auto-approve
          fi
